<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Crest ring — a restrained nod to a seal, not a literal crown -->
  <circle cx="50" cy="52" r="44" stroke="#C9A26A" stroke-width="1.25" opacity="0.55"/>
  <circle cx="50" cy="52" r="38" stroke="#C9A26A" stroke-width="0.75" opacity="0.35"/>

  <!-- Diamond finial — the "jewel" accent -->
  <rect x="44.5" y="19" width="10" height="10" transform="rotate(45 49.5 24)" fill="#C9A26A"/>

  <!-- K monogram: uniform-width strokes for clean geometry -->
  <line x1="37.5" y1="35" x2="37.5" y2="75" stroke="#C9A26A" stroke-width="7" stroke-linecap="square"/>
  <line x1="39" y1="55" x2="68" y2="35" stroke="#C9A26A" stroke-width="7" stroke-linecap="square"/>
  <line x1="39" y1="56" x2="68" y2="76" stroke="#C9A26A" stroke-width="7" stroke-linecap="square"/>
</svg>
